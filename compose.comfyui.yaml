name: pain

services:
  # Share the LLM service identity so switching replaces pain-engine.
  engine:
    container_name: pain-engine
    restart: "no"
    init: true
    ports:
      - "127.0.0.1:${PAIN_COMFYUI_PORT:-8188}:8188"
    volumes:
      - "${PAIN_COMFYUI_DATA_DIR:?Use ./ai or set PAIN_COMFYUI_DATA_DIR}:/data"
      - "${PAIN_COMFYUI_MODELS_DIR:?Use ./ai or set PAIN_COMFYUI_MODELS_DIR}:/data/models"
      - "./integrations/comfyui/painless_downloads:/data/custom_nodes/painless_downloads:ro"
    environment:
      PUID: "${PAIN_COMFYUI_UID:-1000}"
      PGID: "${PAIN_COMFYUI_GID:-1000}"
      COMFYUI_CPU: "false"
      COMFYUI_PORT: "8188"
      COMFYUI_BUNDLED_NODES: "none"
      COMFYUI_ENABLE_MANAGER: "true"
      COMFYUI_INSTALL_NODE_REQUIREMENTS: "true"
      COMFYUI_ARGS: "${PAIN_COMFYUI_ARGS:-}"
    labels:
      ai.pain.backend: "${PAIN_BACKEND}"
