name: pain

services:
  ollama:
    restart: "no"
    ports:
      - "127.0.0.1:${PAIN_PORT:-11434}:11434"
    volumes:
      - models:/root/.ollama
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_CONTEXT_LENGTH: "${PAIN_CONTEXT_LENGTH:-65536}"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "${PAIN_KV_CACHE_TYPE:-f16}"
      OLLAMA_KEEP_ALIVE: "${PAIN_KEEP_ALIVE:-30m}"
    labels:
      ai.pain.backend: "${PAIN_BACKEND}"

volumes:
  models:
    external: true
    name: "${PAIN_MODELS_VOLUME:-ollama}"
