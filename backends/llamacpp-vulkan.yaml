services:
  ollama:
    image: "${PAIN_LLAMACPP_VULKAN_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-vulkan}"
    devices:
      - /dev/dri:/dev/dri
    environment:
      GGML_VULKAN_DEVICE: "0"
    command: >
      ${PAIN_LLAMACPP_CMD:---models-preset /models/hot/models.ini --models-max 1 --models-autoload --host 0.0.0.0 --port 11434}
