services:
  engine:
    image: "${PAIN_ROCM_IMAGE:-ollama/ollama:0.40.13-rocm}"
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    environment:
      OLLAMA_MODELS: "/models/ollama"
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_CONTEXT_LENGTH: "${PAIN_CONTEXT_LENGTH:-65536}"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "${PAIN_KV_CACHE_TYPE:-f16}"
      OLLAMA_KEEP_ALIVE: "${PAIN_KEEP_ALIVE:-30m}"
      OLLAMA_VULKAN: "0"
