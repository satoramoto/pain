name: Mac QA
on:
  push:
    branches: ['fix/mac-virtgpu']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -v
      - run: npm --prefix desktop ci
      - run: npm --prefix desktop run build
      - run: npm --prefix desktop run build-storybook
      - run: npm --prefix desktop run test:stories -- --no-browser
  mac-runtime:
    needs: checks
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check Apple Silicon builder
        run: test "$(uname -m)" = arm64
      - name: Install build dependencies on CI only
        run: |
          brew install cmake meson ninja pkgconf libepoxy molten-vk
          brew tap slp/krun
          brew trust slp/krun
          brew install slp/krun/krunkit
      - name: Build relocatable APIR and Metal runtime
        run: ./integrations/macos/build-runtime
      - name: Upload runtime and checksum
        uses: actions/upload-artifact@v4
        with:
          name: pain-macos-runtime-arm64
          path: |
            .build/pain-macos-runtime-arm64.tar.gz
            .build/pain-macos-runtime-arm64.tar.gz.sha256
          if-no-files-found: error
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop build dependencies
        run: npm --prefix desktop ci
      - name: Validate controller and UI
        run: |
          npm --prefix desktop run build-storybook
      - name: Stage application resources
        run: npm --prefix desktop run stage
      - name: Build Tauri Mac application
        working-directory: desktop
        run: npm run tauri build -- --target aarch64-apple-darwin
      - name: Upload Mac application
        uses: actions/upload-artifact@v4
        with:
          name: pain-macos-app-arm64
          path: desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
